name: Test Schedule

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo timestamp
        run: |
          echo "Workflow triggered at UTC: $(date -u)"
          echo "Workflow triggered at: $(date)"
          echo "Scheduled run works!"
