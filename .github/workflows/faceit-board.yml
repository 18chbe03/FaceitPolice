name: Uppdatera FACEIT-tavlan

on:
  schedule:
    - cron: '2,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs-grisarna-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Kör GRIS-tavlan
        run: dotnet run --configuration Release
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONTHLY_DISCORD_WEBHOOK_URL: ${{ secrets.MONTHLY_DISCORD_WEBHOOK_URL }}

          AWARDS_MESSAGE_ID: ${{ vars.AWARDS_MESSAGE_ID }}
          DISCORD_MESSAGE_ID: ${{ vars.DISCORD_MESSAGE_ID }}
          MAP_STATS_MESSAGE_ID: ${{ vars.MAP_STATS_MESSAGE_ID }}
          TILT_WATCH_MESSAGE_ID: ${{ vars.TILT_WATCH_MESSAGE_ID }}

          FACEIT_PLAYERS: ${{ vars.FACEIT_PLAYERS }}

      - name: Spara historik, cache och månadsstate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history/*.json

          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera FACEIT historik och cache"
            git pull --rebase origin main
            git push origin main
          fi
