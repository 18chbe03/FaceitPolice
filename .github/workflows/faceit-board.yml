name: Uppdatera FACEIT-tavlan

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Stockholm"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Kör FACEIT-tavlan
        run: dotnet run --configuration Release
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ vars.DISCORD_MESSAGE_ID }}
          TILT_WATCH_MESSAGE_ID: ${{ vars.TILT_WATCH_MESSAGE_ID }}
          FACEIT_PLAYERS: ${{ vars.FACEIT_PLAYERS }}


      - name: Spara ELO-historik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history/elo-history.json

          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera FACEIT ELO-historik"
            git push
          fi